name: Snapshot live site

# Manual only. Pulls production down so it can be diffed against the repo.
# Reading PHP source is impossible over HTTP, so FTP is the only way to see
# what is actually running on the server.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Mirror the app code
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || vars.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          [ -n "${REMOTE_DIR:-}" ] || REMOTE_DIR=/
          mkdir -p snapshot

          # ALLOWLIST, not a denylist. The FTP root also holds a WordPress
          # install, old branches and thousands of post images. Excluding them
          # by pattern once produced a 7.9 GB artifact when a pattern silently
          # failed to match; naming the wanted directories instead means the
          # worst case is a missing folder, not a runaway download.
          {
            echo "set ftp:ssl-force true"
            echo "set ftp:ssl-protect-data true"
            echo "set ssl:verify-certificate true"
            echo "set net:max-retries 3"
            echo "set cmd:fail-exit true"
            # Even inside the code directories there are multi-gigabyte
            # non-code files: geocam.zip, geoCamBackup11_8_22.zip, admin.zip,
            # php/error_log, and an extensionless 1.5 GB blob. Cap by size
            # (range is min-max, so -4M means 0-4M) and name the known
            # offenders; "*~*" drops stale editor backups like flags~.json.
            F='--size-range=-4M'
            F="$F --exclude-glob '*.zip' --exclude-glob '*.pdf'"
            F="$F --exclude-glob 'error_log*' --exclude-glob '*~*'"
            # Root: files only, no descent into shop/, posts/, testBranches/.
            printf 'mirror --verbose --no-recursion %s "%s" snapshot/\n' "$F" "$REMOTE_DIR"
            for d in php js css assets; do
              printf 'mirror --verbose %s "%s%s" "snapshot/%s"\n' "$F" "$REMOTE_DIR" "$d" "$d"
            done
            echo "bye"
          } > mirror.lftp

          echo "--- lftp script ---"; cat mirror.lftp; echo "-------------------"

          # -e and -u must precede the host: "lftp -f" takes a script INSTEAD
          # of a host, so combining the two makes lftp hand "-f" to open.
          lftp -u "$FTP_USERNAME" --env-password \
               -e "source mirror.lftp" "ftp://$FTP_SERVER"

      - name: Refuse an implausibly large snapshot
        run: |
          set -euo pipefail
          size_mb=$(du -sm snapshot | cut -f1)
          files=$(find snapshot -type f | wc -l)
          echo "snapshot: ${size_mb} MB across ${files} files"
          # The app is a few hundred KB of code. Anything near this ceiling
          # means a mirror walked somewhere it should not have.
          if [ "$size_mb" -gt 50 ]; then
            echo "::error::Snapshot is ${size_mb} MB -- expected a few MB of code. Refusing to continue."
            exit 1
          fi
          echo "--- tree ---"
          find snapshot -type f | sort

      - name: Separate code from live data
        run: |
          set -euo pipefail
          # Credentials, session tokens and the webhook must not land in an
          # artifact that anyone with repo access can download.
          mkdir -p code
          rsync -a --exclude='users.json' --exclude='sessions.json' \
                   --exclude='mailKeys.json' --exclude='forgotKeys.json' \
                   --exclude='flags.json' --exclude='commentFlags.json' \
                   --exclude='discord.txt' --exclude='accessCode.txt' \
                   --exclude='status.txt' --exclude='.ftpquota' \
                   --exclude='error_log' --exclude='logs/' \
                   snapshot/ code/
          echo "code files: $(find code -type f | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: live-code-snapshot-${{ github.run_number }}
          path: code/
          retention-days: 30

      # Overlay the live code onto a branch cut from main. The resulting PR
      # diff is exactly "what production has that the repo does not" -- which
      # is the thing that needs reviewing. Git cannot merge this itself: the
      # live edits have no common ancestor in history.
      - name: Open a reconciliation PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch main \
            "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B production-baseline

          # Overlay only. No --delete: repo-only paths (tests/, docs/,
          # .github/) are not on the server and must survive.
          rsync -a ../code/ ./

          if [ -z "$(git status --porcelain)" ]; then
            echo "Live site matches the repo -- nothing to reconcile."
            exit 0
          fi

          git add -A
          git commit --quiet -m "Snapshot of live site $(date -u +%Y-%m-%d)" \
                     -m "Mirrored from production over FTP by the snapshot workflow. This is the code actually running on the server, including edits made directly through cPanel File Manager that were never committed."
          git push --quiet --force-with-lease origin production-baseline

          if gh pr view production-baseline --json number >/dev/null 2>&1; then
            echo "Existing PR updated."
          else
            gh pr create --base main --head production-baseline \
              --title "Reconcile live site with repo" \
              --body "Code mirrored from production by the \`Snapshot live site\` workflow.

          The diff is what the server has that \`main\` does not -- including files edited directly in cPanel File Manager. Review it by hand: these commits share no ancestor with the live edits, so git cannot merge them automatically.

          Live data files (users.json, sessions.json, discord.txt, etc.) are excluded."
          fi
          gh pr view production-baseline --json url --jq .url
