name: Deploy to Bluehost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never let two deploys touch the server at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # 1. Don't ship code that doesn't parse.
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: bash tests/run.sh

  # ---------------------------------------------------------------------
  # 2. Pull the live JSON store down BEFORE touching the server.
  #    The app has no backup logic of its own, so this workflow is it.
  # ---------------------------------------------------------------------
  backup:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      # Bluehost's FTP certificate is issued for the physical server
      # (e.g. box1234.bluehost.com), not usually for your domain. This prints
      # the names the cert actually covers so FTP_SERVER can be set to match.
      - name: Inspect FTP server certificate
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo "Certificate presented on port 21:"
          openssl s_client -starttls ftp -connect "$FTP_SERVER:21" -servername "$FTP_SERVER" </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -ext subjectAltName \
            || echo "could not read certificate"

      # A 530 means the credentials were rejected outright. The two usual
      # causes on Bluehost are a short username (cPanel FTP accounts are named
      # "user@yourdomain.com", not "user") and stray whitespace pasted into a
      # secret. This distinguishes them without printing any secret value.
      - name: Verify FTP credentials
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || vars.FTP_REMOTE_DIR }}
        run: |
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          [ -n "${REMOTE_DIR:-}" ] || REMOTE_DIR=/

          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD REMOTE_DIR; do
            eval "val=\$$name"
            if [ "$val" != "$(trim "$val")" ]; then
              echo "::error::$name has leading or trailing whitespace -- re-paste the secret"
            else
              echo "$name: no stray whitespace"
            fi
          done

          case "$FTP_USERNAME" in
            *@*) echo "FTP_USERNAME: contains '@' (expected cPanel form)" ;;
            *)   echo "::warning::FTP_USERNAME has no '@'. Bluehost FTP accounts are usually 'user@yourdomain.com' -- copy the full name from cPanel > FTP Accounts" ;;
          esac

          # Detailed LIST (not NLST) so directories are distinguishable.
          ls_dir() {
            curl --ssl-reqd --fail --silent --show-error \
                 --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER$1"
          }

          echo "--- attempting login, listing FTP home (/) ---"
          if ! home="$(ls_dir /)"; then
            echo "::error::Login rejected (530). Check FTP_USERNAME and FTP_PASSWORD in cPanel > FTP Accounts."
            exit 0
          fi
          echo "$home"

          # Walk one level down so the real folder names are visible.
          subdirs="$(printf '%s\n' "$home" | awk '/^d/ && $NF !~ /^\.\.?$/ {print $NF}')"
          if [ -z "$subdirs" ]; then
            echo "::warning::FTP home is empty. The cPanel FTP account is probably jailed to a new, empty folder named after the account. Repoint it via FTP Accounts > Change Directory, then set FTP_REMOTE_DIR to /"
          else
            for d in $subdirs; do
              echo "--- /$d ---"
              ls_dir "/$d/" | awk '{print $NF}' | paste -sd' ' - || true
            done
          fi

          echo "--- listing configured FTP_REMOTE_DIR ---"
          if target="$(ls_dir "${REMOTE_DIR}")"; then
            printf '%s\n' "$target" | awk '{print $NF}' | paste -sd' ' -
            if printf '%s\n' "$target" | awk '{print $NF}' | grep -qx 'php'; then
              echo "FTP_REMOTE_DIR looks correct (contains php/)"
            else
              echo "::warning::FTP_REMOTE_DIR is reachable but has no php/ directory -- likely not the web root"
            fi
          else
            echo "::error::FTP_REMOTE_DIR is not reachable. Pick the correct folder from the listings above; if the home itself is the app folder, use /"
          fi

      - name: Download live data files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR || vars.FTP_REMOTE_DIR }}
          # >>> TLS VERIFICATION SWITCH <<<
          # "false" = verify the server's identity (correct, preferred).
          # "true"  = still encrypted, but the server is not authenticated.
          # Only set "true" if no hostname matches Bluehost's certificate.
          # This matches the deploy action's own default (security: loose).
          TLS_INSECURE: "false"
        run: |
          set -euo pipefail

          # There is no default web root -- a wrong or missing path must fail
          # loudly rather than silently aiming at the wrong directory.
          # The value is a secret, so it is masked in logs; check shape only.
          # A jailed cPanel FTP account is always rooted at its own directory,
          # so "/" is correct by construction and safe as a default. Leaving the
          # secret unset also keeps logs readable: a secret of "/" makes GitHub
          # mask every slash in every line.
          if [ -z "${REMOTE_DIR:-}" ]; then
            REMOTE_DIR=/
            echo "FTP_REMOTE_DIR not set -- defaulting to / (correct for a jailed FTP account)"
          fi
          case "$REMOTE_DIR" in
            /) ;;      # a jailed FTP account is rooted at its own directory
            /*/) ;;
            *) echo "::error::FTP_REMOTE_DIR must start and end with '/' (use / for a jailed FTP account)"; exit 1 ;;
          esac

          mkdir -p backup/php backup/posts

          # Files that MUST exist. A failure here aborts the deploy.
          required="php/users.json posts/posts.json"
          # Files that may legitimately be absent on a fresh install.
          optional="php/sessions.json php/mailKeys.json php/forgotKeys.json \
                    php/flags.json php/commentFlags.json php/blockedWords.json \
                    php/discord.txt php/accessCode.txt php/status.txt"

          tls_opts="--ssl-reqd"
          if [ "$TLS_INSECURE" = "true" ]; then
            echo "::warning::TLS verification disabled -- traffic is encrypted but the server is not authenticated"
            tls_opts="--ssl-reqd --insecure"
          fi

          fetch() {
            curl $tls_opts --fail --silent --show-error \
                 --user "$FTP_USERNAME:$FTP_PASSWORD" \
                 "ftp://$FTP_SERVER${REMOTE_DIR}$1" -o "backup/$1"
          }

          for f in $required; do
            echo "backing up $f"
            fetch "$f"
          done

          for f in $optional; do
            if fetch "$f"; then echo "backed up $f"; else echo "skipped $f (absent)"; fi
          done

          echo "--- backup contents ---"
          find backup -type f -exec ls -l {} +

      - name: Sanity-check the backup
        run: |
          set -euo pipefail
          # An empty or malformed users.json means we grabbed the wrong path,
          # or the live store is already damaged. Either way: stop.
          for f in backup/php/users.json backup/posts/posts.json; do
            [ -s "$f" ] || { echo "::error::$f is empty -- check FTP_REMOTE_DIR"; exit 1; }
            python3 -c "import json,sys; json.load(open('$f'))" \
              || { echo "::error::$f is not valid JSON"; exit 1; }
          done
          echo "backup looks sane"

      - uses: actions/upload-artifact@v4
        with:
          name: data-backup-${{ github.run_number }}-${{ github.sha }}
          path: backup/
          retention-days: 90

  # ---------------------------------------------------------------------
  # 3. Sync code only. Every runtime-written file is excluded by name.
  # ---------------------------------------------------------------------
  deploy:
    needs: backup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Rewrite js/css references to carry a content hash. Done here, against
      # the ephemeral checkout, so the repo keeps clean filenames while the
      # browser still sees a new URL whenever a file's bytes change. Replaces
      # the old scheme of renaming files (indexScriptV79 -> V80), which left
      # every superseded version on the server forever.
      # Exits non-zero if a page references an asset that is not there.
      - name: Stamp assets with a content hash
        run: python3 scripts/stamp-assets.py

      - name: Sync files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Bluehost presents a publicly-trusted Sectigo wildcard for
          # *.bluehost.com, so FTP_SERVER must be the box hostname
          # (box2261.bluehost.com) rather than the domain. That makes full
          # certificate verification possible; don't downgrade this to "loose".
          security: strict
          server-dir: ${{ secrets.FTP_REMOTE_DIR || vars.FTP_REMOTE_DIR || '/' }}
          # >>> SAFETY SWITCH <<<
          # true  = rehearsal, connects and logs but writes nothing.
          # false = real deploy.
          # Set to true again to rehearse a risky change before shipping it.
          dry-run: false
          log-level: standard
          # NOTE: setting `exclude` REPLACES the action's defaults, so the
          # .git patterns have to be repeated here.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            .gitignore
            AGENTS.md
            README.md
            tests/**
            docs/**
            scripts/**
            php/users.json
            php/sessions.json
            php/mailKeys.json
            php/forgotKeys.json
            php/flags.json
            php/commentFlags.json
            php/blockedWords.json
            php/discord.txt
            php/accessCode.txt
            php/status.txt
            posts/**
            logs/**
